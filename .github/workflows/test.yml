name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all workspaces
        run: bun run build:all

      - name: Validate package artifact
        run: |
          package_tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          artifact_path="$RUNNER_TEMP/$package_tarball"
          bunx publint --strict "$artifact_path"

          consumer_dir="$RUNNER_TEMP/tanstack-minimum-consumer"
          mkdir -p "$consumer_dir"
          cp test/compatibility/tanstack-minimum.ts "$consumer_dir/probe.ts"
          cd "$consumer_dir"
          bun init -y > /dev/null
          bun add --exact "$artifact_path" @tanstack/react-query@5.62.0 @elysiajs/eden@1.4.9 elysia@1.4.29 react@18.3.1 @types/react@18.3.28 typescript@5.9.3 > /dev/null
          bunx tsc --noEmit --strict --skipLibCheck --module preserve --moduleResolution bundler --target ES2022 probe.ts
        working-directory: packages/eden-tanstack-query

      - name: Run tests with coverage
        run: bun run unit-test:run

      - name: Run package tests on the Bun runtime
        run: bun test --preload ./test-utils/happydom.ts
        working-directory: packages/eden-tanstack-query

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
